# ============================================================
# 站点基本信息
# jekyll-seo-tag 会拿 title / description 生成搜索结果里的摘要，
# 所以 description 写人话，别空着。
# ============================================================
theme: minima
title: clowly的个人博客
description: 在这里记录我的学习、项目与生活
author: clowly

# ============================================================
# 页脚社交图标
# minima 2.5.1 用的是这几个固定字段名，填了就自动出现图标。
# 不想公开的整行删掉即可。
# ============================================================
github_username: U-HanQi-I
rss: RSS 订阅
# email: your@mail.com

# ============================================================
# 显示设置
# ============================================================
# 首页文章列表显示摘要，而不是光秃秃一个标题
show_excerpts: true

# 日期格式（默认是 "Sep 16, 2026" 这种英文写法）
minima:
  date_format: "%Y-%m-%d"

# ============================================================
# 顶部导航栏
# 这里列的每个文件都要真实存在，顺序就是导航的显示顺序。
# 不写这一项的话，minima 会把所有页面都塞进导航里。
# ============================================================
header_pages:
  - about.md
